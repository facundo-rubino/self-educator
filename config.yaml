# ---------------------------------------------------------------------------
# Los dos archivos que se editan: este y kb/SCHEMA.md.
#
# Para apuntar todo esto a otro tema (otra persona, otro proyecto): cambiá
# `topic`, `themes` y `sources`. No hay que tocar código. Ver ADAPTING.md.
# ---------------------------------------------------------------------------

topic: >-
  Cómo un dev que lidera proyectos y también enseña a programar hace mejor su
  trabajo: agentes de IA aplicados a programar, gestionar y enseñar,
  liderazgo técnico de equipos chicos (estimación, secuenciamiento, alcance,
  organización personal), oficio de software engineering en general, y
  productividad y técnicas de estudio.
  # Docencia de programación entry-level se mudó al profile `teaching` de
  # pogba (KB acumulativa aparte); ya no compite por cupo en este brief.

provider: deepseek
model: deepseek-chat

# --- Los temas del brief ---------------------------------------------------
# Usados dos veces: la etapa 2 puntúa relevancia contra esto, y el brief llena
# el cupo de cada tema con lo mismo. `quota` es cuántos items entran por tema;
# la suma es el largo del brief. Tope pensado para 10 minutos de lectura.
themes:
